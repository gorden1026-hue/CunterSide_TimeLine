<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 스토리 연표</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0d0d14;
    color: #fff;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden; /* 전체 화면 고정 후 내부 캔버스만 2D 스크롤 */
    user-select: none; /* 드래그 시 글자 선택 방지 */
  }

  /* 상단 안내 바 */
  .header-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
    font-size: 14px;
  }
  .header-title { font-weight: bold; color: #4cc9f0; }
  .header-tip { color: #aaa; font-size: 12px; }

  /* 2차원 스크롤 뷰포트 */
  #viewport {
    width: 100vw;
    height: 100vh;
    overflow: auto;
    cursor: grab;
    position: relative;
  }
  #viewport:active { cursor: grabbing; }

  /* 연표 전체 도화지 (가로로 긴 띠 - 크기 조절 가능) */
  #canvas {
    width: 3000px;
    height: 1200px;
    position: relative;
    /* ★ 전체 배경 이미지 주소 변경 위치 ★ */
    background-image: url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=2000&q=80');
    background-size: cover;
    background-position: center;
  }

  /* 도화지 위 어두운 틴트 (카드 가독성 확보) */
  #canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 18, 0.55);
  }

  /* 중앙을 가로지르는 메인 시간선 */
  .timeline-axis {
    position: absolute;
    top: 600px; /* canvas height의 절반 */
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, rgba(76,201,240,0.2), rgba(76,201,240,0.9), rgba(247,37,133,0.9), rgba(255,209,102,0.2));
    box-shadow: 0 0 15px rgba(76, 201, 240, 0.6);
    z-index: 1;
  }

  /* 개별 사건 상자 스타일 */
  .event-card {
    position: absolute;
    width: 300px;
    min-height: 190px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
    background-size: cover;
    background-position: center;
    z-index: 2;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .event-card:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 16px 36px rgba(76, 201, 240, 0.35);
    border-color: rgba(76, 201, 240, 0.8);
    z-index: 10;
  }

  /* 카드 내부 텍스트 보호용 그라데이션 오버레이 */
  .card-overlay {
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.88));
    padding: 18px;
    height: 100%;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .event-era {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }
  .event-title {
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }
  .event-desc {
    font-size: 13.5px;
    line-height: 1.55;
    color: #e2e2e8;
  }
</style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">📖 세계관 스토리 연표</div>
    <div class="header-tip">💡 화면을 마우스로 드래그하거나 스크롤해서 자유롭게 이동하세요</div>
  </div>

  <div id="viewport">
    <div id="canvas">
      <div class="timeline-axis"></div>

      <!-- [사건 상자 1] top(위아래 위치), left(좌우 위치), background-image(배경) 수정 -->
      <div class="event-card" style="top: 320px; left: 150px; background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80');">
        <div class="card-overlay">
          <div class="event-era" style="color: #4cc9f0;">제 1기 · 태초의 시대</div>
          <div class="event-title">최초의 불씨</div>
          <div class="event-desc">혼돈의 심연 속에서 첫 번째 성화가 피어오르며 대륙과 신들이 탄생한 사건입니다.</div>
        </div>
      </div>

      <!-- [사건 상자 2] -->
      <div class="event-card" style="top: 660px; left: 520px; background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80');">
        <div class="card-overlay">
          <div class="event-era" style="color: #f72585;">제 2기 · 마력 전쟁</div>
          <div class="event-title">고대 제국의 몰락</div>
          <div class="event-desc">금기시된 차원 마법을 개방한 대가로 황도가 하룻밤 만에 바다 아래로 가라앉았습니다.</div>
        </div>
      </div>

      <!-- [사건 상자 3] -->
      <div class="event-card" style="top: 290px; left: 920px; background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=600&q=80');">
        <div class="card-overlay">
          <div class="event-era" style="color: #ffd166;">제 3기 · 현재</div>
          <div class="event-title">주인공의 각성</div>
          <div class="event-desc">변방의 작은 마을에서 자란 주인공이 봉인된 유적을 발견하며 기나긴 여정이 시작됩니다.</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 마우스 클릭 후 드래그로 2차원 스크롤 지원 스크립트 -->
  <script>
    const viewport = document.getElementById('viewport');
    let isDown = false, startX, startY, scrollLeft, scrollTop;

    // 초기 시작 위치를 세로 중앙 부근으로 맞춤
    window.addEventListener('load', () => {
      viewport.scrollTop = 250;
    });

    viewport.addEventListener('mousedown', (e) => {
      isDown = true;
      startX = e.pageX - viewport.offsetLeft;
      startY = e.pageY - viewport.offsetTop;
      scrollLeft = viewport.scrollLeft;
      scrollTop = viewport.scrollTop;
    });
    viewport.addEventListener('mouseleave', () => { isDown = false; });
    viewport.addEventListener('mouseup', () => { isDown = false; });
    viewport.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - viewport.offsetLeft;
      const y = e.pageY - viewport.offsetTop;
      viewport.scrollLeft = scrollLeft - (x - startX) * 1.3;
      viewport.scrollTop = scrollTop - (y - startY) * 1.3;
    });
  </script>
</body>
</html>
