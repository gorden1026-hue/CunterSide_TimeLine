<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카운터사이드 스토리 연표</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html {
    width: 100%;
    height: 100%;
    background-color: #0d0d14;
    color: #fff;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* 상단 안내 바 */
  .header-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: rgba(15, 15, 25, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
    font-size: 14px;
  }
  .header-title { font-weight: bold; color: #4cc9f0; }
  .header-tip { color: #aaa; font-size: 12px; }

  /* 전체 화면 뷰포트 */
  #viewport {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    position: relative;
  }
  #viewport:active { cursor: grabbing; }

  /* 대형 도화지 (전체 이벤트 배치용) */
  #canvas {
    width: 11500px;
    height: 1200px;
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    background-image: url('Images/background.jpg');
    background-size: cover;
    background-position: center;
    will-change: transform;
  }

  #canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 18, 0.65);
  }

  /* 중앙 메인스트림 기준선 */
  .timeline-axis {
    position: absolute;
    top: 560px;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, rgba(76,201,240,0.2), rgba(76,201,240,0.8), rgba(247,37,133,0.8), rgba(255,209,102,0.2));
    z-index: 1;
  }

  /* 사건 카드 스타일 */
  .event-card {
    position: absolute;
    width: 270px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.75);
    background-size: cover;
    background-position: center;
    background-color: #181822;
    z-index: 2;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
  }
  .event-card:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 12px 28px rgba(76, 201, 240, 0.35);
    border-color: rgba(76, 201, 240, 0.85);
    z-index: 20;
  }

  /* 메인스트림 강조 스타일 */
  .event-card.mainstream {
    border-color: rgba(255, 255, 255, 0.45);
    width: 290px;
  }

  .card-overlay {
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.92));
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
  }

  .event-sub { font-size: 11px; font-weight: 600; color: #a0a0b0; margin-bottom: 2px; }
  .mainstream .event-sub { color: #4cc9f0; }
  .event-title { font-size: 15px; font-weight: 700; color: #ffffff; padding-bottom: 5px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
  
  /* 접었다 펼 수 있는 요약 영역 */
  .event-desc {
    font-size: 12px;
    line-height: 1.45;
    color: #dcdce2;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, margin-top 0.25s ease;
  }
  .event-card.expanded .event-desc {
    max-height: 160px;
    margin-top: 6px;
  }
  .toggle-hint {
    font-size: 10px;
    color: #777;
    text-align: right;
    margin-top: 4px;
  }
</style>
</head>

    // 데이터 기반으로 카드 생성 (이름의 띄어쓰기를 언더바로 대체하여 Images/이름.png 로드)
    timelineData.forEach(item => {
      // 특수문자(: , ! … 등)가 파일명에 들어갈 경우를 대비해 공백만 언더바로 치환
      const fileName = item.name.replace(/\s+/g, '_');
      
      const card = document.createElement('div');
      card.className = 'event-card' + (item.isMain ? ' mainstream' : '');
      card.style.left = item.left + 'px';
      card.style.top = item.top + 'px';
      card.style.backgroundImage = `url('Images/${fileName}.png')`;

      card.innerHTML = `
        <div class="card-overlay">
          <div class="event-sub">${item.sub}</div>
          <div class="event-title">${item.name}</div>
          <div class="event-desc">${item.desc}</div>
          <div class="toggle-hint">요약 펼치기 ▼</div>
        </div>
      `;

      // 클릭 시 요약 접기/펼치기 토글
      card.addEventListener('click', () => {
        card.classList.toggle('expanded');
        const hint = card.querySelector('.toggle-hint');
        hint.textContent = card.classList.contains('expanded') ? '접기 ▲' : '요약 펼치기 ▼';
      });

      container.appendChild(card);
    });

    // 맵 드래그 및 줌 엔진
    const viewport = document.getElementById('viewport');
    let posX = 0;
    let posY = -100;
    let scale = 0.85;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function updateTransform() {
      canvas.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }
    updateTransform();

    viewport.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomIntensity = 0.08;
      const wheel = e.deltaY < 0 ? 1 : -1;
      const newScale = Math.min(Math.max(0.25, scale + wheel * zoomIntensity), 2.0);
      scale = newScale;
      updateTransform();
    }, { passive: false });
  </script>
</body>
</html>
